[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-hunter"
version = "0.1.0"
description = "AI Data Hunter core: extract, normalize, deduplicate and validate scraped records (pluggable fetcher, stdlib-only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["data_hunter", "jev"]

[tool.pytest.ini_options]
testpaths = ["."]
